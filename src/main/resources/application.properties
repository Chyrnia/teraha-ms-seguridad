spring.application.name=security

spring.jpa.open-in-view=false

# Database connection
spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/teraha
spring.datasource.username=postgres.bboesrmuocbuqaqoaswr
spring.datasource.password=${DB_PASSWORD}

# Redis connection
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

server.port=0
# Security here as in the name of the microservice, not spring security's
security.pagination.page-size=${PAGE_SIZE:5}

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

logging.level.org.springframework.data.jpa.repository=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=${LOGFILE}

security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}


# Cache retention policies
app.cache.ttl.default-seconds=${CACHE_TTL_DEFAULT_SECONDS:600}
app.cache.ttl.security-users-seconds=${SECURITY_USERS_CACHE_TTL_SECONDS:300}
